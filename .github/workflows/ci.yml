name: CI

on:
  pull_request:
    branches: [platform, main]
  push:
    branches: [platform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      # Matches the Node version in infrastructure/docker/Dockerfile.*.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # apps/api's lint script runs `eslint --fix`, which exits 0 after
      # silently rewriting files. Fail here instead, so unfixed lint issues
      # can't be merged just because they were auto-fixable.
      - name: Fail if lint auto-fixed any files
        run: git diff --exit-code

      - run: pnpm test

      - run: pnpm build
