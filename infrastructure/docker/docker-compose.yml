name: brainstack-ai-receptionist

services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension baked in,
    # needed for the RAG knowledge base (packages/database/migrations/002_knowledge_base.sql).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainstack}
      POSTGRES_DB: ${POSTGRES_DB:-brainstack_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../packages/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainstack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-brainstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainstack}
      POSTGRES_DB: ${POSTGRES_DB:-brainstack_booking}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DASHBOARD_URL: http://localhost:${DASHBOARD_PORT:-3000}
    ports:
      - "${API_PORT:-3001}:3001"

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

volumes:
  postgres_data:
    name: brainstack_postgres_data
  redis_data:
    name: brainstack_redis_data
