name: brainstack-ai-receptionist

services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension baked in,
    # needed for the RAG knowledge base (knowledge_chunks.embedding). The schema
    # comes from Prisma migrations (apps/api/prisma/migrations), applied by
    # `pnpm --filter api prisma:migrate` locally or by the api container on start.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainstack}
      POSTGRES_DB: ${POSTGRES_DB:-brainstack_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainstack} -d ${POSTGRES_DB:-brainstack_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage for uploads (M0 decision T9, M2-9).
  # MinIO stopped publishing free images on Docker Hub and quay.io in 2025;
  # this is Chainguard's build of the same server. Its free tier only has a
  # "latest" tag, so the image is pinned by digest (MinIO RELEASE.2026-09-22).
  # The API creates the bucket on first upload.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-brainstack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-brainstack-dev-secret}
      # Lets `mc ready local` (the health check) reach the server.
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-brainstack}:${S3_SECRET_ACCESS_KEY:-brainstack-dev-secret}@localhost:9000
    # The image runs as user "nonroot" (65532). A volume mounted on its home
    # folder takes that folder's owner, so the server can write to it.
    command: ["server", "/home/nonroot/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/home/nonroot
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3001}
      # Inside the compose network Postgres is `postgres:5432`, not the
      # host-mapped localhost:5433 from the root .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-brainstack}:${POSTGRES_PASSWORD:-brainstack}@postgres:5432/${POSTGRES_DB:-brainstack_booking}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Inside the compose network MinIO is `minio:9000`. NODE_ENV is
      # production here, so bucket creation is switched on explicitly.
      S3_ENDPOINT: http://minio:9000
      S3_CREATE_BUCKET: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-brainstack}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-brainstack-dev-secret}
      DASHBOARD_URL: http://localhost:${DASHBOARD_PORT:-3000}
    ports:
      - "${API_PORT:-3001}:3001"

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

# The `platform` branch (multi-tenant chatbot SaaS) uses its own volumes so
# its new schema never touches the receptionist demo data, which stays in
# brainstack_postgres_data / brainstack_redis_data for the `main` branch.
# Switching branches switches databases; stop the stack before switching
# (`docker compose ... down`), since both use the same host ports.
volumes:
  postgres_data:
    name: brainstack_platform_postgres_data
  redis_data:
    name: brainstack_platform_redis_data
  minio_data:
    name: brainstack_platform_minio_data
