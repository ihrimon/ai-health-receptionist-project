packages:
  - "apps/*"
  - "packages/*"

# sharp/protobufjs need their native postinstall build step — they're
# transitive deps of @xenova/transformers (RAG embeddings), pulled in even
# though this project only uses the text pipeline, not vision. pnpm skips
# build scripts by default for security; explicitly allowlisting these two
# (non-interactively, unlike `pnpm approve-builds`) is required or
# @xenova/transformers fails at runtime with "Cannot find module
# '../build/Release/sharp-win32-x64.node'".
onlyBuiltDependencies:
  - sharp
  - protobufjs

# M7-3 security overrides: force patched versions of transitive dependencies
# (see docs/security-review-m7.md). Remove an entry once the parent package
# itself requires a patched version.
overrides:
  protobufjs@<7.6.3: ">=7.6.3 <8"
  "sharp@<0.35.5": ">=0.35.5"
  "nanoid@<3.3.18": ">=3.3.18 <4"
  "deepmerge-ts@<8.0.0": ">=8.0.0"
  "mysql2@<3.23.1": ">=3.23.1"
  "fast-uri@<3.1.8": ">=3.1.8"
  "js-yaml@>=3 <3.15.2": ">=3.15.2 <4"
  "js-yaml@>=4 <4.3.2": ">=4.3.2 <5"
  "multer@<2.4.0": ">=2.4.0"
  "brace-expansion@<1.1.21": ">=1.1.21 <2"
  "brace-expansion@>=2 <2.1.7": ">=2.1.7 <3"
  "brace-expansion@>=4 <5.0.12": ">=5.0.12"
  "source-map-js@<1.2.2": ">=1.2.2"
  "proxy-addr@<2.0.8": ">=2.0.8 <3"
  "@modelcontextprotocol/sdk@<1.31.0": ">=1.31.0"
  "handlebars@<4.7.10": ">=4.7.10 <5"
  "qs@<6.16.0": ">=6.16.0 <7"
  "ip-address@<10.7.1": ">=10.7.1"
